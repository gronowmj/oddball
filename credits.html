<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e5a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Oddball · Photo credits</title>
<link rel="icon" href="icons/icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
<style>
.credits{padding:12px 14px calc(var(--safe-bottom) + 20px);line-height:1.4;font-size:14.5px}
.credits h2{font-size:17px;color:var(--teal);margin:18px 0 6px}
.credits ul{margin:0;padding-left:18px}.credits li{margin:5px 0;overflow-wrap:anywhere}
.credits a{color:var(--teal)}
.back{display:inline-block;margin-top:4px;font-weight:700;color:var(--teal);text-decoration:none}
</style>
</head>
<body>
<header class="top"><div class="brand"><span class="logo" aria-hidden="true"><i></i><i></i><i class="o"></i><i></i></span><h1>Oddball</h1></div><div class="sub">Photo credits</div></header>
<main class="credits">
<a class="back" href="./">&#8249; Back to the puzzle</a>
<p>All photos come from Wikimedia Commons and are in the public domain or under Creative Commons licences. They have been cropped and resized. Credits are grouped by puzzle day; days still to come are hidden.</p>
<div id="list">Loading…</div>
</main>
<script>
(async()=>{
  const q=new URLSearchParams(location.search);
  const london=()=>{try{const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const g=t=>p.find(x=>x.type===t).value;return `${g('year')}-${g('month')}-${g('day')}`;}catch(e){return new Date().toISOString().slice(0,10);}};
  const today=(q.get('test')==='1'&&q.get('today'))||london();
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const C=await (await fetch('credits.json',{cache:'no-cache'})).json();
  const D=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const nice=s=>{const [y,m,d]=s.split('-').map(Number);return `${D[new Date(Date.UTC(y,m-1,d)).getUTCDay()]} ${d} ${M[m-1]} ${y}`;};
  const days=Object.keys(C).filter(d=>d<=today).sort().reverse();
  const L=document.getElementById('list');
  if(!days.length){L.textContent='No photos yet.';return;}
  L.innerHTML=days.map(d=>`<h2>${nice(d)}</h2><ul>${C[d].map(c=>`<li><a href="${esc(c.source)}" rel="noopener">${esc(decodeURIComponent(c.source.split('File:')[1]||c.source).replace(/_/g,' '))}</a> by ${esc(c.author||'unknown')}, ${esc(c.licence)}</li>`).join('')}</ul>`).join('');
})();
</script>
</body>
</html>
